[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hipai"]

[project]
name = "hipai-montague-semantic-cognition"
version = "0.1.0"
description = "HiPAI Montague Semantic Cognition: A sparse-tensor deductive reasoning engine"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "falkordb>=1.0.12",
    "mcp>=1.3.0",
    "pydantic>=2.10.6",
    "aiohttp>=3.9.0",
    "sentence-transformers>=3.0.0",
    "scikit-learn>=1.8.0",
    "inflect>=7.5.0",
    "spacy>=3.7.0",
    "owlready2>=0.46",
    "dotenv>=0.9.9",
]
[project.scripts]
hipai-mcp = "hipai.mcp_server:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.1.0",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "PTH", "RUF"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
pythonpath = ["src"]
# Only collect the real suite. ``scratch/`` holds throwaway exploration
# scripts (some named test_*.py and some async for convenience); they are not
# part of the test suite and must not be collected.
testpaths = ["tests"]
# Auto mode runs every `async def test_*` as a coroutine test without needing a
# per-test @pytest.mark.asyncio marker (existing markers still work). The
# function loop scope isolates each test's event loop and silences the
# pytest-asyncio default-scope deprecation warning.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
